pluginManagement {
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def p = properties.getProperty("flutter.sdk")
        assert p != null : "flutter.sdk not set in local.properties"
        return p
    }()
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version "8.6.1" apply false   // was 8.5.2
    id "org.jetbrains.kotlin.android" version "2.1.10" apply false  // was 2.0.21
}

include ":app"
