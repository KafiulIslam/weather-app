plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

import java.util.Properties
import java.io.FileInputStream

// ---- Load keystore props BEFORE android { } ----
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
// Fallback if you accidentally placed it under android/app/
if (!keystorePropertiesFile.exists()) {
    keystorePropertiesFile = file('key.properties')
}
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle("WARNING: key.properties not found; release signing will not be configured.")
}

// (Optional) Read local.properties for version values
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}
def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

android {
    namespace "com.weather.check.app"

    // AGP 8.6.x is tested up to API 35. If you have Android 36 installed, you can set 36.
    compileSdkVersion 36
    ndkVersion = "28.0.12433566"

    defaultConfig {
        applicationId "com.weather.check.app"
        minSdkVersion 29
        targetSdkVersion 36
        versionCode 5
        versionName "4.0.2"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    sourceSets { main.java.srcDirs += 'src/main/kotlin' }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                def storeFilePath = keystoreProperties['storeFile']
                storeFile storeFilePath ? file(storeFilePath) : null
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            } else {
                // No key.properties: leave empty so debug still builds; release will need a key to sign.
                logger.lifecycle("WARNING: Release signingConfig not set (no key.properties).")
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            // Uncomment if you use ProGuard/R8 rules
            // minifyEnabled true
            // shrinkResources true
            // proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            // debug signing uses the default debug keystore
        }
    }
}

flutter {
    source '../..'
}

// No extra dependencies needed; Kotlin stdlib is added by the plugin.
// dependencies { }
